services:
  local-rag:
    build: .
    container_name: local_rag_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PDF_SOURCE_DIR=/app/source_pdfs
      - DB_PATH=/app/data/rag_metadata.db
      - REPORTS_DIR=/app/reports
    volumes:
      # Mount folder PDF (bisa di-custom via PDF_SOURCE_PATH di .env, default: ./source_pdfs)
      - ${PDF_SOURCE_PATH:-./source_pdfs}:/app/source_pdfs:ro
      # Mount folder data agar database SQLite tersimpan persisten di host
      - ./data:/app/data
      - ./reports:/app/reports
    stdin_open: true
    tty: true